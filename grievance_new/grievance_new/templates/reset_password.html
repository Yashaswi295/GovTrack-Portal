{% extends 'base.html' %}

{% block head %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020617;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    padding: 40px;
    border-radius: 20px;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  .auth-title {
    text-align: center;
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
    position: relative;
  }

  .form-control {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(15,23,42,0.6);
    color: #fff;
    font-size: 0.95rem;
  }

  .form-control:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }

  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #4f46e5, #3730a3);
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(79,70,229,0.4);
  }

  .error-text {
    color: #f87171;
    font-size: 0.85rem;
    margin-bottom: 10px;
    text-align: center;
  }
</style>
{% endblock %}

{% block content %}
<section class="auth-page">

  <div class="auth-card">

    <h2 class="auth-title">Set New Password 🔒</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="error-text">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" onsubmit="return validatePassword()">

      <div class="form-group">
        <input type="password" id="pass1" name="password" class="form-control" placeholder="New Password" required>
        <i class="fas fa-eye toggle-eye" onclick="toggle('pass1', this)"></i>
      </div>

      <div class="form-group">
        <input type="password" id="pass2" class="form-control" placeholder="Confirm Password" required>
        <i class="fas fa-eye toggle-eye" onclick="toggle('pass2', this)"></i>
      </div>

      <button class="btn-primary">
        Update Password
      </button>

    </form>

  </div>

</section>

<script>
function toggle(id, icon){
  const input = document.getElementById(id);
  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

function validatePassword(){
  const p1 = document.getElementById('pass1').value;
  const p2 = document.getElementById('pass2').value;

  if(p1 !== p2){
    alert("Passwords do not match");
    return false;
  }

  if(p1.length < 6){
    alert("Password must be at least 6 characters");
    return false;
  }

  return true;
}
</script>

{% endblock %}
